# Per-tenant Secret — mTLS material. The receiver presents client.crt/key
# (signed by the resource client CA) to stream from the primary AND to push
# partials to the standby's wal-receive-serve over mTLS; server-ca.crt verifies
# those servers. Three keys, all base64-encoded (use `kubectl create secret
# generic --from-file=...` if you don't want to b64 by hand).
#
# Control plane mints/rotates these via its existing certificate issuance flow
# and writes them in. The receiver pod mounts them read-only at /etc/walg/tls.
apiVersion: v1
kind: Secret
metadata:
  name: walg-recv-${UBID}-secrets
  namespace: walg-receivers
  labels:
    app.kubernetes.io/name: wal-g-receive
    ubicloud.io/postgres-resource-ubid: "${UBID}"
type: Opaque
data:
  # mTLS to primary + standby wal-receive-serve (PEM, base64 encoded)
  client.crt:     "${CLIENT_CRT_B64}"
  client.key:     "${CLIENT_KEY_B64}"
  server-ca.crt:  "${SERVER_CA_CRT_B64}"
